name: Build and publish radiance R9700 channels
on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Label of a prepared Linux source-build runner (32 GiB RAM or more)
        type: string
        default: r9700-radiance-builder
        required: true
      existing_image:
        description: Optional tested local Radiance image to package and publish without recompiling
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: publish-radiance-r9700
  cancel-in-progress: false
jobs:
  build:
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check source-build resources
        if: inputs.existing_image == ''
        run: |
          set -euo pipefail
          for executable in python3 git podman; do command -v "$executable"; done
          df -h .
          free -h
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          memory = dict(line.split(':', 1) for line in Path('/proc/meminfo').read_text().splitlines())
          assert int(memory['MemAvailable'].split()[0]) >= 28 * 1024 * 1024, 'At least 28 GiB available RAM is required'
          assert shutil.disk_usage('.').free >= 80 * 1024**3, 'At least 80 GiB free disk is required'
          PY
      - name: Build current upstream channel
        if: inputs.existing_image == ''
        run: |
          set -euo pipefail
          python3 -u scripts/build_radiance.py --workspace research/radiance-build --jobs 2 --memory 24g 2>&1 | tee "$RUNNER_TEMP/radiance-build.log"
      - name: Package tested local runtime
        if: inputs.existing_image != ''
        env:
          EXISTING_IMAGE: ${{ inputs.existing_image }}
        run: |
          set -euo pipefail
          python3 -u scripts/package_radiance.py --image "$EXISTING_IMAGE" --workspace research/radiance-build 2>&1 | tee "$RUNNER_TEMP/radiance-build.log"
      - name: Verify CPU entry points
        run: |
          podman run --rm --network=none docker.io/kyuz0/amd-r9700-vllm-toolboxes:radiance /opt/vllm/bin/python -c 'import vllm; print(vllm.__version__)'
      - name: Publish rolling channel
        env:
          REGISTRY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          auth_file="$RUNNER_TEMP/radiance-registry-auth.json"
          printf '%s' "$REGISTRY_PASSWORD" | podman login --authfile "$auth_file" --username "$REGISTRY_USERNAME" --password-stdin docker.io
          image="docker.io/kyuz0/amd-r9700-vllm-toolboxes:radiance"
          podman push --authfile "$auth_file" "$image"
          echo "Published $image" >> "$GITHUB_STEP_SUMMARY"
          cat research/radiance-build/BUILD-IDENTITY.json >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary registry authentication
        if: always()
        run: |
          auth_file="$RUNNER_TEMP/radiance-registry-auth.json"
          if test -f "$auth_file"; then
            podman logout --authfile "$auth_file" docker.io || true
            rm -f -- "$auth_file"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radiance-build-provenance
          path: |
            research/radiance-build/*IDENTITY.json
            research/radiance-build/BASE-NORMALIZATION.json
            research/radiance-build/Dockerfile.engine
